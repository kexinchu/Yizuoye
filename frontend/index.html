<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>易作业 · 绿色教学平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="login" id="login"><div class="cover"><div style="font-size:26px;font-weight:800">🌿 易作业 <span style="font-size:13px;opacity:.7">YI ZUO YE</span></div><h1>让每一次作业<br>都成为成长。</h1><p>以作业连接师生，以积分激发热爱。<br>让教学更轻松，让学习更有趣。</p><div class="illustration"><div class="emojis">📗 ✏️ 🎓</div><h3>智慧课堂 · 成长同行</h3><p>作业管理 / 学习反馈 / 积分激励 / 教学资源</p></div></div><div class="loginright"><div class="login-language" id="loginLanguageControl"><button type="button" class="language-trigger" aria-label="切换语言 / Change language" aria-haspopup="true" aria-expanded="false" onclick="toggleLoginLanguage(event)"><span class="language-globe"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/></svg></span><span id="languageCurrent">中文</span><span class="language-chevron"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span></button><div class="language-menu" role="menu"><button type="button" class="language-option" data-lang="zh" onclick="chooseLoginLanguage('zh')"><span class="language-code">中</span> 中文 <span class="language-check"></span></button><button type="button" class="language-option" data-lang="ar" onclick="chooseLoginLanguage('ar')"><span class="language-code">AR</span> العربية <span class="language-check"></span></button><button type="button" class="language-option" data-lang="fr" onclick="chooseLoginLanguage('fr')"><span class="language-code">FR</span> Français <span class="language-check"></span></button><button type="button" class="language-option" data-lang="en" onclick="chooseLoginLanguage('en')"><span class="language-code">EN</span> English <span class="language-check"></span></button></div><select id="loginLanguageSelect" aria-label="Language / 语言"><option value="zh">中文</option><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select></div><div class="loginbox"><span class="pill">欢迎使用 · 电脑预览版</span><h2>欢迎回来 👋</h2><p class="muted">请选择身份，进入你的专属学习空间</p><div class="switch"><button id="studenttab" onclick="setRole('student')">🎒 学生登录</button><button class="active" id="teachertab" onclick="setRole('teacher')">👩‍🏫 教师登录</button></div><div class="field"><label id="accountlabel">教师用户名</label><input id="account" value="teacher" placeholder="请输入账号"></div><div class="field hidden" id="namefield"><label>学生姓名</label><input id="studentname" value="张三" placeholder="请输入姓名"></div><div class="field"><label>密码</label><input id="password" type="password" value="123"></div><button class="primary" id="submitAuth" style="width:100%;margin-top:14px" onclick="submitAuth()">登录易作业 →</button><button type="button" class="secondary" id="toggleAuth" style="width:100%;margin-top:10px" onclick="toggleAuthMode()">注册新账号</button><p class="muted" style="margin-top:20px">演示教师：teacher / 123<br>演示学生：2026001 / 张三 / 123</p><p class="small muted">作业与账号数据保存在本机服务中，供同一台电脑上的师生使用。</p></div></div></div>
<div class="shell" id="shell"><div id="studentLanguageControl" style="display:none;position:fixed;right:18px;bottom:18px;z-index:1000;background:white;padding:9px 12px;border:1px solid #c9e4d4;border-radius:12px;box-shadow:0 5px 22px #0002;align-items:center;gap:8px;direction:ltr"><label for="studentLanguageSelect" style="font-size:13px">🌐 Language</label><select id="studentLanguageSelect" onchange="setStudentLanguage(this.value)" style="width:auto;min-width:105px;padding:6px"><option value="zh">中文</option><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select></div><aside class="sidebar"><div class="brand">🌿 易作业</div><div id="nav"></div><div class="bottom"><button class="navbtn" onclick="logout()">↩ 退出登录</button></div></aside><main class="main"><div class="top"><h2 id="pagetitle">我的教室</h2><div class="avatar" id="avatar">👩‍🏫 教师</div></div><div id="content"></div></main></div><div class="modalbg" id="modalbg"><div class="modal"><div class="row"><h2 id="modaltitle"></h2><button class="secondary right" onclick="closeModal()">✕</button></div><div id="modalbody"></div></div></div><div class="toast" id="toast"></div>
<script src="/config.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script src="/actions.js"></script>
</body>
</html>
